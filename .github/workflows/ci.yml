name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Lint is non-blocking (pre-existing lint debt); surfaced but does not fail CI.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm test

      # `build` runs `tsc -b && vite build` → typecheck is part of the gate.
      - name: Build
        run: npm run build
