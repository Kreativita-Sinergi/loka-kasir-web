# Server block app.lokakasir.id — web kasir (SPA Vite statis), pindah dari Vercel 2026-10-23.
# File build ada di /var/www/lokakasir-app/current (symlink, diisi oleh .github/workflows/deploy.yml).
# Blok 443 ditambahkan certbot (`sudo certbot --nginx -d app.lokakasir.id`) setelah DNS mengarah ke server ini.
server {
    listen 80;
    listen [::]:80;
    server_name app.lokakasir.id;

    server_tokens off;
    root /var/www/lokakasir-app/current;
    index index.html;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # aset build Vite berisi hash di namanya — aman di-cache setahun
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html & service worker jangan di-cache supaya rilis baru langsung terpakai
    location ~ ^/(index\.html|sw\.js)$ {
        add_header Cache-Control "no-cache";
    }

    # rewrite SPA (pengganti vercel.json)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
